<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitTrack</title>
<meta name="description" content="Personal training &amp; body-weight tracker. All data stays on your device.">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1 id="screenTitle">Today</h1>
  <p class="sub" id="screenSub"></p>
</header>

<main id="main">
  <section class="screen" id="screen-today"></section>
  <section class="screen" id="screen-workouts"></section>
  <section class="screen" id="screen-progress"></section>
  <section class="screen" id="screen-settings"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-screen="today" aria-label="Today">
    <span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg></span>
    <span>Today</span>
  </button>
  <button class="tab" data-screen="workouts" aria-label="Workouts">
    <span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M2.5 12h2M19.5 12h2M8.5 12h7"/><rect x="5" y="8" width="3.5" height="8" rx="1"/><rect x="15.5" y="8" width="3.5" height="8" rx="1"/></svg></span>
    <span>Workouts</span>
  </button>
  <button class="tab" data-screen="progress" aria-label="Progress">
    <span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M4 5v14h16"/><path d="M7 14l3.5-3.5 3 2.5 5.5-6"/></svg></span>
    <span>Progress</span>
  </button>
  <button class="tab" data-screen="settings" aria-label="Settings">
    <span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="12" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></span>
    <span>Settings</span>
  </button>
</nav>

<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/charts.js"></script>
<script src="js/workouts.js"></script>
<script src="js/progress.js"></script>
<script src="js/today.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
